plugins {
    id 'com.android.application'
}

android {
    namespace 'com.manuel.cybercalculator'
    compileSdk 34

    defaultConfig {
        applicationId "com.manuel.cybercalculator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}

